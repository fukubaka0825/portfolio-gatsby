<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: B; src: url('../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-standard-normal.woff2'); font-weight: 200 800; font-stretch: 75% 100%; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #f5d33f; color: #0f2b2f; font-family: B, sans-serif; position: relative; overflow: hidden; }
  .streak { position: absolute; top: -20px; width: 26px; height: 420px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.75) 0 2px, transparent 2px 5px); opacity: .7; transform: rotate(3deg); }
  h1 { position: absolute; left: 64px; bottom: 170px; margin: 0; font-size: 150px; line-height: .88; letter-spacing: -.04em; font-weight: 800; }
  .rule { position: absolute; left: 64px; right: 64px; bottom: 130px; height: 4px; background: #0f2b2f; }
  p { position: absolute; left: 64px; bottom: 58px; margin: 0; font-size: 34px; font-weight: 650; letter-spacing: -.01em; }
  .handle { position: absolute; right: 64px; bottom: 60px; font-size: 30px; font-weight: 700; color: #0f2b2f; }
  .av { position: absolute; right: 70px; top: 56px; width: 250px; height: 250px; border: 7px solid #0f2b2f; border-radius: 42% 58% 55% 45%/50% 45% 55% 50%; overflow: hidden; transform: rotate(4deg); box-shadow: 14px 14px 0 #ee7d1c; }
  .av img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
  <div class="streak" style="left:90px"></div><div class="streak" style="left:470px;height:300px"></div><div class="streak" style="left:760px;height:360px"></div>
  <div class="av"><img src="../src/assets/profile/nari.jpg" alt="" /></div>
  <h1>Takashi<br />Narikawa</h1>
  <div class="rule"></div>
  <p>Senior Software Engineer, LLM Platform &amp; Enablement</p>
</body>
</html>
