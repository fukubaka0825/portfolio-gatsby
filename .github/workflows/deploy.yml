name: Deploy

on:
  push:
    branches: [master]
  schedule:
    # 06:17 JST daily: pulls in new posts from the external feeds shown in the Writing section.
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # `needs` on a skipped job would skip this one too; scheduled runs deliberately bypass the full CI.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx astro build

      - name: Compare with the live site
        id: diff
        run: |
          git fetch --depth=1 origin gh-pages
          git worktree add --detach /tmp/live origin/gh-pages
          if diff -rq --exclude=.git /tmp/live dist > /tmp/diff.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            head -50 /tmp/diff.txt
          fi

      - name: Publish to gh-pages
        # Scheduled rebuilds only publish when a feed actually produced new output.
        if: github.event_name != 'schedule' || steps.diff.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          cname: www.fukubaka0825.dev
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'Deploy ${{ github.sha }} (${{ github.event_name }})'

  lighthouse-prod:
    name: Lighthouse (production)
    needs: deploy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Wait for Pages to serve the new build
        run: sleep 90
      - uses: treosh/lighthouse-ci-action@12.6.2
        with:
          urls: |
            https://www.fukubaka0825.dev/
            https://www.fukubaka0825.dev/blog/
          configPath: ./lighthouserc.prod.json
          uploadArtifacts: true
          temporaryPublicStorage: true
