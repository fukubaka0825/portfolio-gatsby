version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      tooling:
        patterns: ['@biomejs/*', '@playwright/*', 'typescript', '@types/*']
      styling:
        patterns: ['tailwindcss', '@tailwindcss/*', '@fontsource*']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
